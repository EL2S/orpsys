{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <title>Erreur 400 | Salimamoud</title>
    <link rel="icon" href="{% static 'img/logo/salimamoud.png' %}" />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    <link href="{% static 'css/theme.css' %}" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-card text-center space-y-4">
        <div class="auth-logo">

        <h1 class="text-3xl font-bold">Erreur 400</h1>
        <p class="text-muted-foreground">La requête est invalide. Vérifiez vos informations et réessayez.</p>
        <a href="{% url 'login' %}" class="inline-flex items-center justify-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground">Retour à l'accueil</a>
      </div>
    </main>
