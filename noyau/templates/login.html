{% load static %}
<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salimamoud ERP Système</title>

    <link rel="icon" href="{% static 'img/logo/salimamoud.png' %}" />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    <link href="{% static 'css/theme.css' %}" rel="stylesheet" />
  </head>

  <body>
    {{ employees_payload|json_script:"employees_json" }}
    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <img src="{% static 'img/logo/salimamoud-white.png' %}" alt="Salimamoud Logo" />
          </div>
          <div class="auth-title">Salimamoud</div>
          <div class="auth-subtitle">Système de gestion intégré</div>
        </div>

        <div class="space-y-4">
          <div class="tabs-shell grid grid-cols-2">
            <button id="btn-badge" class="inline-flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-semibold bg-background">Badge</button>
            <button id="btn-password" class="inline-flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-semibold">Mot de passe</button>
          </div>

          {% if error_message %}
            <div class="rounded-md border border-destructive/30 bg-destructive/10 px-3 py-2 text-sm text-destructive">
              {{ error_message }}
            </div>
          {% endif %}

          <div class="flex-1 space-y-4 mt-6" id="tab-badge">
            <div class="badge-panel flex flex-col items-center space-y-6 p-5 rounded-xl">
              <div class="w-28 h-28 rounded-full flex items-center justify-center bg-muted">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan w-12 h-12 text-muted-foreground">
                  <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                  <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                  <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                  <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                </svg>
              </div>

              <div class="text-center space-y-2">
                <h3 class="font-semibold text-lg">Scannez votre badge</h3>
                <p class="text-sm text-muted-foreground">Approchez votre badge du lecteur</p>
              </div>

              <form class="w-full opacity-0 h-0 overflow-hidden" method="POST" id="scanHiddenForm">
                {% csrf_token %}
                <input type="hidden" name="type" value="scan" />
                <input type="hidden" id="scan_employer_id" name="scan_employer_id" />
                <input class="h-9 w-full rounded-md border px-3 py-1 bg-transparent" type="text" id="scan" name="scan" required autocomplete="off" />
              </form>
            </div>
          </div>

          <div class="flex-1 outline-none space-y-4 mt-6" id="tab-password">
            <form class="space-y-4" method="POST">
              {% csrf_token %}
              <input type="hidden" name="type" value="saisit" />
              <div class="space-y-2">
                <label data-slot="label" for="employeeId" class="flex items-center gap-2 text-sm leading-none font-medium">ID Employé</label>
                <input name="username" id="employeeId" placeholder="EMP001" required class="file:text-foreground placeholder:text-muted-foreground selection:bg-primary selection:text-primary-foreground dark:bg-input/30 border-input h-10 w-full min-w-0 rounded-md border bg-transparent px-3 py-2 text-base shadow-xs transition-[color,box-shadow] outline-none file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive" />
              </div>

              <div class="space-y-2">
                <label for="password" class="flex items-center gap-2 text-sm leading-none font-medium">Mot de passe</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required class="file:text-foreground placeholder:text-muted-foreground selection:bg-primary selection:text-primary-foreground dark:bg-input/30 border-input h-10 w-full min-w-0 rounded-md border bg-transparent px-3 py-2 text-base shadow-xs transition-[color,box-shadow] outline-none file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive" />
              </div>

              <button type="submit" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-semibold transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full">Se connecter</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="{% static 'js/login.js' %}"></script>
  </body>
</html>
